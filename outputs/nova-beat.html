<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NOVA BEAT · 恒定 BPM 进度条</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<style>
:root{
  --accent:#00e5ff;
  --accent2:#ff2d95;
  --panel:rgba(16,20,38,.72);
  --line:rgba(255,255,255,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:#0b0f1e;color:#eaf2ff;
  font-family:"SF Pro Display","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  overflow:hidden;user-select:none;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer;}
.screen{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:24px;background:rgba(7,9,20,.52);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.hidden{display:none!important;}
.title{
  font-size:clamp(42px,9vw,92px);font-weight:900;letter-spacing:.14em;line-height:1.05;text-align:center;
  background:linear-gradient(100deg,var(--accent),#7cf7ff 30%,var(--accent2) 70%,#ffd166);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 20px rgba(0,229,255,.35));
}
.title span{background:linear-gradient(100deg,var(--accent2),#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent;}
.subtitle{color:rgba(234,242,255,.62);letter-spacing:.22em;font-size:13px;text-align:center;}
#trackList{display:flex;flex-direction:column;gap:10px;width:min(640px,94vw);max-height:42vh;overflow-y:auto;padding:2px;}
#trackList::-webkit-scrollbar{width:6px;}
#trackList::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px;}
.track-card{
  position:relative;display:flex;align-items:center;gap:16px;padding:14px 18px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;
  transition:transform .15s,box-shadow .2s,border-color .2s;overflow:hidden;flex-shrink:0;
}
.track-card:hover{transform:translateX(4px);border-color:rgba(255,255,255,.28);}
.track-card.selected{border-color:var(--accent);box-shadow:0 0 26px rgba(0,229,255,.25),inset 0 0 18px rgba(0,229,255,.05);}
.tc-num{font-size:26px;font-weight:900;color:rgba(255,255,255,.22);font-style:italic;width:46px;flex-shrink:0;}
.tc-info{flex:1;min-width:0;}
.tc-name{font-size:19px;font-weight:800;letter-spacing:.08em;}
.tc-meta{font-size:12px;color:rgba(234,242,255,.5);margin-top:3px;}
.tc-best{font-size:12px;color:rgba(234,242,255,.42);margin-top:2px;}
.tc-bar{position:absolute;left:0;top:0;bottom:0;width:4px;opacity:.9;}
.diff-row{display:flex;gap:10px;}
.diff-btn{
  padding:9px 24px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  color:rgba(234,242,255,.75);font-size:14px;cursor:pointer;transition:.15s;font-family:inherit;
}
.diff-btn:hover{color:#fff;}
.diff-btn.selected{
  background:linear-gradient(100deg,var(--accent),var(--accent2));border-color:transparent;
  color:#081020;font-weight:800;box-shadow:0 0 18px rgba(0,229,255,.35);
}
.btn-start{
  font-size:20px;font-weight:900;letter-spacing:.3em;padding:14px 54px;border:none;border-radius:999px;cursor:pointer;
  color:#081020;background:linear-gradient(100deg,var(--accent),var(--accent2));
  box-shadow:0 0 26px rgba(0,229,255,.45),0 8px 30px rgba(0,0,0,.35);
  transition:transform .15s,box-shadow .2s;font-family:inherit;
}
.btn-start:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 38px rgba(0,229,255,.6),0 12px 34px rgba(0,0,0,.4);}
.btn-start:active{transform:scale(.97);}
.ctrl-hint{font-size:13px;color:rgba(234,242,255,.45);letter-spacing:.05em;text-align:center;line-height:2;}
.ctrl-hint b{color:rgba(234,242,255,.85);}
.vol-row{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(234,242,255,.6);}
input[type=range]{width:150px;accent-color:var(--accent);}
.hud{position:fixed;inset:0;z-index:10;pointer-events:none;padding:16px 20px;}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.hud-block b{font-size:clamp(24px,4vw,36px);font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 0 14px rgba(0,229,255,.55);font-variant-numeric:tabular-nums;}
.hud-label{font-size:11px;letter-spacing:.28em;color:rgba(234,242,255,.45);}
.hud-right{text-align:right;}
.hud-mid{position:absolute;left:50%;top:16px;transform:translateX(-50%);text-align:center;}
#trackLabel{font-size:12px;letter-spacing:.18em;color:rgba(234,242,255,.55);white-space:nowrap;}
.hud-center{position:absolute;top:27%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
.combo{font-size:clamp(40px,8vw,74px);font-weight:900;color:#fff;text-shadow:0 0 26px rgba(0,229,255,.75);line-height:1;}
.combo.pop{animation:comboPop .18s ease;}
@keyframes comboPop{0%{transform:scale(1.35);}100%{transform:scale(1);}}
.combo-sub{font-size:12px;letter-spacing:.3em;color:rgba(234,242,255,.5);margin-top:4px;}
#progressWrap{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.08);}
#progress{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px rgba(0,229,255,.8);}
.pause-btn{
  position:absolute;top:14px;right:20px;pointer-events:auto;width:44px;height:44px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);color:#eaf2ff;font-size:18px;cursor:pointer;transition:.15s;font-family:inherit;
}
.pause-btn:hover{border-color:var(--accent);box-shadow:0 0 14px rgba(0,229,255,.3);}
.play-hint{
  position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:13px;
  color:rgba(234,242,255,.42);letter-spacing:.14em;
}
#pause h2{font-size:34px;letter-spacing:.5em;margin-left:.5em;text-shadow:0 0 20px rgba(0,229,255,.5);}
.row{display:flex;gap:12px;}
.ghost-btn{
  padding:11px 26px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  color:#eaf2ff;font-size:15px;cursor:pointer;transition:.15s;font-family:inherit;
}
.ghost-btn:hover{border-color:var(--accent);box-shadow:0 0 14px rgba(0,229,255,.25);}
.res-box{
  display:flex;flex-direction:column;align-items:center;gap:14px;padding:34px 42px;
  border:1px solid var(--line);border-radius:20px;background:rgba(14,18,34,.88);
  box-shadow:0 0 60px rgba(0,229,255,.12),0 24px 60px rgba(0,0,0,.5);width:min(540px,92vw);
}
.res-track{font-size:13px;letter-spacing:.2em;color:rgba(234,242,255,.55);}
.grade{font-size:118px;font-weight:900;line-height:1;background:linear-gradient(120deg,#ffd166,#ff2d95);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,45,149,.4));}
.new-record{color:#ffd166;font-weight:800;letter-spacing:.2em;animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.4}}
.res-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;text-align:center;}
.res-grid div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 4px;}
.res-grid span{display:block;font-size:11px;color:rgba(234,242,255,.5);letter-spacing:.15em;margin-bottom:4px;}
.res-grid b{font-size:16px;font-variant-numeric:tabular-nums;}
.res-actions{display:flex;gap:12px;margin-top:4px;}
@media (max-width:640px){
  .res-grid{grid-template-columns:repeat(2,1fr);}
  #trackList{max-height:34vh;}
  .title{letter-spacing:.08em;}
  .hud-block b{font-size:22px;}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- 主菜单 -->
<div id="menu" class="screen">
  <h1 class="title">NOVA <span>BEAT</span></h1>
  <p class="subtitle">光点沿固定轨道匀速前进 · 到达音符瞬间按任意键</p>
  <div id="trackList"></div>
  <div class="diff-row" id="diffRow">
    <button class="diff-btn" data-diff="easy">轻松</button>
    <button class="diff-btn selected" data-diff="normal">普通</button>
    <button class="diff-btn" data-diff="hard">困难</button>
  </div>
  <button id="btnStart" class="btn-start">开 始</button>
  <div class="ctrl-hint">
    轨道<b>固定不变</b>，光点匀速沿轨道前进（冰与火之舞式）<br>
    音符是轨道上的光环，<b>光点到达光环的瞬间按任意键</b>（点击 / 触屏亦可）<br>
    休止时光点会放慢、半拍插音时加速 · <b>P</b> 暂停
  </div>
  <div class="vol-row">音量 <input id="vol" type="range" min="0" max="100" value="85"></div>
</div>

<!-- 游戏中 HUD -->
<div id="hud" class="hud hidden">
  <div id="progressWrap"><div id="progress"></div></div>
  <div class="hud-top">
    <div class="hud-block">
      <div class="hud-label">得分 SCORE</div>
      <b id="score">0</b>
    </div>
    <div class="hud-mid"><div id="trackLabel"></div></div>
    <div class="hud-block hud-right">
      <div class="hud-label">准确率 ACC</div>
      <b id="acc">100%</b>
    </div>
  </div>
  <button id="btnPause" class="pause-btn">⏸</button>
  <div class="hud-center">
    <div id="combo" class="combo">0</div>
    <div id="comboSub" class="combo-sub"></div>
  </div>
  <div class="play-hint">看光点，听节奏 · 光点到达光环时按任意键</div>
</div>

<!-- 暂停 -->
<div id="pause" class="screen hidden">
  <h2>已暂停</h2>
  <div class="row">
    <button id="btnResume" class="ghost-btn">继续</button>
    <button id="btnRestart" class="ghost-btn">重新开始</button>
    <button id="btnQuit" class="ghost-btn">返回菜单</button>
  </div>
</div>

<!-- 结算 -->
<div id="results" class="screen hidden">
  <div class="res-box">
    <div class="res-track" id="resTrack"></div>
    <div id="grade" class="grade">S</div>
    <div id="newRecord" class="new-record hidden">新纪录 !</div>
    <div class="res-grid">
      <div><span>得分</span><b id="resScore">0</b></div>
      <div><span>准确率</span><b id="resAcc">0%</b></div>
      <div><span>最大连击</span><b id="resCombo">0</b></div>
      <div><span>完美/很棒/不错/漏</span><b id="resJudge">0/0/0/0</b></div>
    </div>
    <div class="res-actions">
      <button id="btnRetry" class="ghost-btn">再来一次</button>
      <button id="btnMenu" class="ghost-btn">返回菜单</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const midiToFreq=m=>440*Math.pow(2,(m-69)/12);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hexToRgba(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
function roundRect(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const FONT='"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif';

/* ================= 曲目 ================= */
const TRACKS=[
  {
    id:'neon', name:'NEON SKY', genre:'电子 / EDM', bpm:124, duration:58, seed:42,
    color:'#00e5ff', color2:'#ff2d95',
    path:{type:'flower',m:5,a:0.32},
    chords:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],
    bassOffset:-12, leadBoost:0,
    arp:[0,1,2,1,0,2,1,0,2,1,0,1,2,1,0,2]
  },
  {
    id:'drive', name:'MIDNIGHT DRIVE', genre:'合成器浪潮 / Synthwave', bpm:92, duration:66, seed:7,
    color:'#ff5ea8', color2:'#5b8cff',
    path:{type:'lemniscate'},
    chords:[[48,51,55],[44,48,52],[39,43,46],[46,50,53]],
    bassOffset:0, leadBoost:12,
    arp:[0,2,1,2,0,1,2,1]
  },
  {
    id:'pop', name:'HYPER POP', genre:'流行 / Pop', bpm:140, duration:60, seed:21,
    color:'#ffd166', color2:'#06d6a0',
    path:{type:'flower',m:4,a:0.5},
    chords:[[53,57,60],[50,54,57],[58,62,65],[60,64,67]],
    bassOffset:-12, leadBoost:0,
    arp:[0,1,2,1,0,2,1,2,0,1,2,1,2,0,1,0]
  }
];

const DIFF_LABEL={easy:'轻松',normal:'普通',hard:'困难'};
const JUDGE_TEXT={perfect:'完美 PERFECT',great:'很棒 GREAT',good:'不错 GOOD',miss:'漏了 MISS'};
const JUDGE_COLORS={perfect:'#ffd166',great:'#7cf7ff',good:'#a9b8ff',miss:'#ff5d7a'};

/* ================= 谱面：单线时间轴（冰与火式） =================
   音符 = 光点需要按键的时刻。节奏型：正拍为主，
   休止（隔 2 拍）、半拍插音、十六分插音、连插（两个半拍）。
   光点沿固定轨道匀速前进，两个音符之间的轨道段用时 = 两音间隔。 */
function buildPattern(bpm,duration,diff,seed){
  const salt=diff==='easy'?1:diff==='normal'?2:3;
  const rnd=mulberry32((seed*2654435761+salt)>>>0);
  const spb=60/bpm;
  const maxT=duration-0.05;
  const times=[];
  let t=0;
  if(diff==='easy'){
    while(t<maxT){
      times.push(t);
      t+=(rnd()<0.10? 2*spb : spb);
    }
  }else if(diff==='normal'){
    while(t<maxT){
      times.push(t);
      const r=rnd();
      if(r<0.16) t+=2*spb;
      else{
        if(r<0.30 && t+spb/2<maxT) times.push(t+spb/2);
        t+=spb;
      }
    }
  }else{
    while(t<maxT){
      times.push(t);
      const r=rnd();
      if(r<0.14) t+=2*spb;
      else if(r<0.30){
        if(t+spb/2<maxT) times.push(t+spb/2);
        t+=spb;
      }else if(r<0.42){
        if(t+spb/2<maxT) times.push(t+spb/2);
        if(t+spb<maxT) times.push(t+spb);
        t+=2*spb;
      }else if(r<0.52){
        if(t+spb/4<maxT) times.push(t+spb/4);
        t+=spb;
      }else{
        t+=spb;
      }
    }
  }
  times.sort((a,b)=>a-b);
  return times;
}

function buildEvents(bpm,times,def){
  const spb=60/bpm;
  const events=[];
  const ev=(t,k,o)=>events.push(Object.assign({t,k},o));
  const chords=def.chords;
  const arp=def.arp;
  let lastT=0, beatPos=0, bar=-1, tone=0, lastDistinct=-1;
  for(let i=0;i<times.length;i++){
    const t=times[i];
    if(t!==lastT){
      beatPos+=(t-lastT)/spb;
      lastT=t;
    }
    const b=Math.floor(beatPos/4);
    if(b!==bar){ bar=b; tone=0; }
    const inBar=beatPos%4;
    const chord=chords[bar%chords.length];
    if(t!==lastDistinct){
      ev(t,'kick');
      ev(t,'bass',{m:chord[0]+def.bassOffset,d:spb*1.8});
      if(Math.abs(inBar-1)<0.2||Math.abs(inBar-3)<0.2) ev(t,'snare');
      if(bar%8===0&&inBar<0.15) ev(t,'crash');
      lastDistinct=t;
    }
    ev(t,'lead',{m:chord[arp[tone%arp.length]]+def.leadBoost,d:spb*0.85});
    tone++;
  }
  const total=times.length? times[times.length-1]+spb*4 : 0;
  for(let k=0;k*spb/2<total;k++){
    const t=k*spb/2;
    let near=false;
    for(let i=0;i<times.length;i++){
      if(Math.abs(times[i]-t)<0.03){ near=true; break; }
    }
    if(near) continue;
    ev(t,'hat',{v:k%2?0.14:0.09,open:k%8===7});
  }
  events.sort((a,b)=>a.t-b.t);
  return events;
}

/* ================= 第一关（NEON SKY）：近似人类作曲 =================
   Am–F–C–G 和弦进行；4 小节乐句的旋律（起承转合 + 变奏）；
   4/4 鼓组（底鼓四踩、军鼓 2&4、八分踩镲、开镲句尾）；
   八度弹跳贝斯、和弦垫、段落过渡 riser。音乐按小节网格生成，与谱面天然对齐。 */
function buildNeonSong(bpm){
  const spb=60/bpm;
  const events=[];
  const ev=(t,k,o)=>events.push(Object.assign({t,k},o));
  const rnd=mulberry32(20260811);
  const bars=30;
  const roots=[45,41,48,43];                 // Am F C G 低音根音
  const chords=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];
  const P=[69,72,74,76,79];                  // A 小调五声：A4 C5 D5 E5 G5
  const phrases={
    A :[[0,0.5,69],[0.5,0.5,72],[1,1,76],[2,0.5,74],[2.5,0.5,72],[3,0.5,69]],
    A2:[[0,0.5,69],[0.5,0.5,72],[1,1,76],[2,0.5,74],[2.5,0.5,76],[3,1,79]],
    B :[[0,1,79],[1,0.5,76],[1.5,0.5,74],[2,1,72],[3,0.5,74],[3.5,0.5,76]],
    B2:[[0,0.5,81],[0.5,0.5,79],[1,0.5,76],[1.5,0.5,74],[2,1,72],[3,0.5,76],[3.5,0.5,79]],
    C :[[0,2,69],[2,1,72],[3,1,74]],
    D :[[0,1,69],[1,1,72],[2,2,69]]
  };
  const mainMelody=[
    ['A','A','B','B2'],
    ['A','A2','B','B2'],
    ['B','B','A','A2'],
    ['B2','B2','A','A2']
  ];
  for(let bar=0;bar<bars;bar++){
    const t0=bar*4*spb;
    const ci=bar%4;
    const root=roots[ci];
    const chord=chords[ci];
    const section=bar<8?'intro':bar<26?'main':'outro';
    // 鼓组
    for(let b=0;b<4;b++) ev(t0+b*spb,'kick',{v:0.92});
    if(bar>=2){
      for(let e=0;e<8;e++) ev(t0+e*spb/2,'hat',{v:(e%2?0.15:0.09)+(e===7?0.06:0),open:e===7});
    }
    if(bar>=4){
      for(let b=0;b<4;b++){ if(b===1||b===3) ev(t0+b*spb,'snare',{v:0.85}); }
    }
    if(bar%4===0) ev(t0,'crash',{v:0.5});
    if(bar===7||bar===15||bar===23){
      for(let e=0;e<8;e++) ev(t0+e*spb/2,'riser',{v:0.10+e/80});
    }
    // 贝斯：八度弹跳 8 分
    if(bar>=2){
      for(let e=0;e<8;e++){
        const m=root+((e%4===1||e%4===3)?12:0);
        ev(t0+e*spb/2,'bass',{m:m,d:spb*0.44,v:e%2?0.30:0.46});
      }
    }
    // 和弦垫
    if(bar>=4) ev(t0,'pad',{m:chord.map(x=>x+12),d:4*spb*0.97,v:0.05});
    // 旋律：主段 18 小节，乐句起承转合 + 变奏；尾段收束
    if(section==='main'){
      const phrase=mainMelody[Math.floor((bar-8)/4)%4][(bar-8)%4];
      for(const note of phrases[phrase]){
        const b=note[0], dur=note[1], midi=note[2];
        ev(t0+b*spb,'lead',{m:midi,d:dur*spb*0.92,v:b===0?0.24:0.19+rnd()*0.03});
      }
    }else if(section==='outro'){
      if(bar===26){ for(const n of phrases.C) ev(t0+n[0]*spb,'lead',{m:n[2],d:n[1]*spb*0.92,v:0.22}); }
      if(bar===27){ for(const n of phrases.D) ev(t0+n[0]*spb,'lead',{m:n[2],d:n[1]*spb*0.95,v:0.22}); }
    }
  }
  const endT=bars*4*spb;
  ev(endT,'kick',{v:0.9});
  ev(endT,'crash',{v:0.45});
  events.sort((a,b)=>a.t-b.t);
  return events;
}

/* ================= 音频引擎 ================= */
const audio={ctx:null,master:null,delay:null,delayFB:null,delaySend:null,vol:0.85,noiseBuf:null};

function ensureAudio(){
  if(!audio.ctx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    const c=new AC();
    audio.ctx=c;
    audio.master=c.createGain();
    audio.master.gain.value=audio.vol;
    const comp=c.createDynamicsCompressor();
    audio.master.connect(comp);
    comp.connect(c.destination);
    audio.delay=c.createDelay(1.0);
    audio.delay.delayTime.value=0.32;
    const lp=c.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=2800;
    audio.delayFB=c.createGain(); audio.delayFB.gain.value=0.32;
    audio.delaySend=c.createGain(); audio.delaySend.gain.value=0.22;
    audio.delaySend.connect(audio.delay);
    audio.delay.connect(lp); lp.connect(audio.delayFB); audio.delayFB.connect(audio.delay);
    audio.delay.connect(audio.master);
    const len=c.sampleRate;
    audio.noiseBuf=c.createBuffer(1,len,c.sampleRate);
    const d=audio.noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  }
  if(audio.ctx.state==='suspended') audio.ctx.resume();
}

function noiseSrc(t,dur){
  const c=audio.ctx, src=c.createBufferSource();
  src.buffer=audio.noiseBuf;
  src.loop=true;
  src.start(t,Math.random());
  src.stop(t+dur+0.02);
  return src;
}

function playEvent(e,t){
  if(!audio.ctx) return;
  const c=audio.ctx;
  switch(e.k){
    case 'kick': {
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(165,t);
      o.frequency.exponentialRampToValueAtTime(45,t+0.12);
      g.gain.setValueAtTime((e.v||1)*1.05,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      o.connect(g); g.connect(audio.master);
      o.start(t); o.stop(t+0.32);
      break;
    }
    case 'snare': {
      const src=noiseSrc(t,0.18), f=c.createBiquadFilter(), g=c.createGain();
      f.type='bandpass'; f.frequency.value=1900; f.Q.value=0.7;
      g.gain.setValueAtTime((e.v||0.85)*0.65,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
      src.connect(f); f.connect(g); g.connect(audio.master);
      const o=c.createOscillator(), g2=c.createGain();
      o.type='triangle';
      o.frequency.setValueAtTime(210,t);
      o.frequency.exponentialRampToValueAtTime(140,t+0.08);
      g2.gain.setValueAtTime(0.35,t);
      g2.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      o.connect(g2); g2.connect(audio.master);
      o.start(t); o.stop(t+0.11);
      break;
    }
    case 'hat': {
      const src=noiseSrc(t,e.open?0.22:0.05), f=c.createBiquadFilter(), g=c.createGain();
      f.type='highpass'; f.frequency.value=7200;
      g.gain.setValueAtTime(e.v||0.14,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+(e.open?0.22:0.05));
      src.connect(f); f.connect(g); g.connect(audio.master);
      break;
    }
    case 'crash': {
      const src=noiseSrc(t,1.1), f=c.createBiquadFilter(), g=c.createGain();
      f.type='highpass'; f.frequency.value=3600;
      g.gain.setValueAtTime((e.v||0.5)*0.56,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+1.1);
      src.connect(f); f.connect(g); g.connect(audio.master);
      break;
    }
    case 'riser': {
      const src=noiseSrc(t,1.0), f=c.createBiquadFilter(), g=c.createGain();
      f.type='bandpass'; f.Q.value=2;
      f.frequency.setValueAtTime(300,t);
      f.frequency.exponentialRampToValueAtTime(5000,t+0.95);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(e.v||0.12,t+0.9);
      g.gain.exponentialRampToValueAtTime(0.0001,t+1.0);
      src.connect(f); f.connect(g); g.connect(audio.master);
      break;
    }
    case 'pad': {
      e.m.forEach(m=>{
        const o=c.createOscillator(), flt=c.createBiquadFilter(), g=c.createGain();
        o.type='triangle'; o.frequency.value=midiToFreq(m);
        flt.type='lowpass'; flt.frequency.value=900;
        const vol=e.v||0.05;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.linearRampToValueAtTime(vol,t+0.35);
        g.gain.setValueAtTime(vol,t+e.d*0.7);
        g.gain.linearRampToValueAtTime(0.0001,t+e.d);
        o.connect(flt); flt.connect(g); g.connect(audio.master);
        o.start(t); o.stop(t+e.d+0.05);
      });
      break;
    }
    case 'bass': {
      const o=c.createOscillator(), flt=c.createBiquadFilter(), g=c.createGain();
      o.type='sawtooth'; o.frequency.value=midiToFreq(e.m);
      flt.type='lowpass'; flt.Q.value=6;
      flt.frequency.setValueAtTime(750,t);
      flt.frequency.exponentialRampToValueAtTime(180,t+e.d*0.8);
      g.gain.setValueAtTime(0.001,t);
      g.gain.exponentialRampToValueAtTime(e.v||0.46,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.001,t+e.d);
      o.connect(flt); flt.connect(g); g.connect(audio.master);
      o.start(t); o.stop(t+e.d+0.02);
      break;
    }
    case 'lead': {
      const f0=midiToFreq(e.m), dur=Math.max(0.12,e.d);
      [-5,5].forEach(det=>{
        const o=c.createOscillator(), flt=c.createBiquadFilter(), g=c.createGain();
        o.type='sawtooth'; o.frequency.value=f0*(1+det/1200);
        flt.type='lowpass'; flt.frequency.value=2600; flt.Q.value=1.2;
        g.gain.setValueAtTime(0.001,t);
        g.gain.exponentialRampToValueAtTime(e.v||0.22,t+0.012);
        g.gain.exponentialRampToValueAtTime(0.001,t+dur);
        o.connect(flt); flt.connect(g);
        g.connect(audio.master);
        g.connect(audio.delaySend);
        o.start(t); o.stop(t+dur+0.02);
      });
      break;
    }
  }
}

function playHitTick(){
  if(!audio.ctx||!audio.master) return;
  const t=audio.ctx.currentTime;
  const o=audio.ctx.createOscillator(), g=audio.ctx.createGain();
  o.type='square';
  o.frequency.setValueAtTime(1600,t);
  o.frequency.exponentialRampToValueAtTime(700,t+0.045);
  g.gain.setValueAtTime(0.05,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g); g.connect(audio.master);
  o.start(t); o.stop(t+0.06);
}

  start:0, pausedAt:0,
  t(){ return audio.ctx? audio.ctx.currentTime : performance.now()/1000; },
  now(){ return this.t()-this.start; },
  suspend(){ this.pausedAt=this.now(); if(audio.ctx && audio.ctx.state==='running') audio.ctx.suspend(); },
  resume(){ if(audio.ctx){ if(audio.ctx.state==='suspended') audio.ctx.resume(); } else { this.start=this.t()-this.pausedAt; } }
};

function loadBest(id,diff){
  try{ const v=localStorage.getItem('novabeat:'+id+':'+diff); return v? JSON.parse(v):null; }catch(e){ return null; }
}
function saveBest(id,diff,data){
  try{ localStorage.setItem('novabeat:'+id+':'+diff,JSON.stringify(data)); }catch(e){}
}
function bestOf(id){
  let best=null;
  ['easy','normal','hard'].forEach(d=>{
    const v=loadBest(id,d);
    if(v && (!best || v.score>best.score)) best=v;
  });
  return best;
}

/* ================= 开始 / 暂停 / 结束 ================= */
function resetGame(){
  game.score=0; game.combo=0; game.maxCombo=0;
  game.perfect=game.great=game.good=game.miss=0;
  game.particles.length=0; game.judgments.length=0; game.multis.length=0;
  game.shockwaves.length=0; game.shake=0;
  game.flash={t:9,color:'rgba(0,0,0,0)'};
  game.tooEarlyFlash=0;
  game.paused=false; game.schedIdx=0;
}

function startGame(){
  ensureAudio();
  resetGame();
  const def=TRACKS[game.trackIdx];
  const diff=game.diff;
  const lead=0.9;
  const spb=60/def.bpm;
  const times=buildPattern(def.bpm,def.duration,diff,def.seed);
  game.notes=times;
  game.events=def.id==='neon'? buildNeonSong(def.bpm) : buildEvents(def.bpm,times,def);
  game.path=buildPath(def);
  game.idx=0;
  game.endTime=times[times.length-1]+1.0;
  game.windows=
    diff==='easy'? {perfect:.05,great:.1,good:.16}:
    diff==='normal'? {perfect:.048,great:.095,good:.145}:
    {perfect:.045,great:.09,good:.13};
  game.state='playing';
  gameClock.start=(audio.ctx? audio.ctx.currentTime : performance.now()/1000)+lead;
  $('#menu').classList.add('hidden');
  $('#results').classList.add('hidden');
  $('#hud').classList.remove('hidden');
  $('#trackLabel').textContent=def.name+' · '+DIFF_LABEL[diff];
  $('#progress').style.width='0%';
  $('#combo').textContent='0';
  $('#comboSub').textContent='';
}

function togglePause(){
  if(game.state!=='playing') return;
  if(!game.paused){
    game.paused=true;
    gameClock.suspend();
    $('#pause').classList.remove('hidden');
  }else{
    gameClock.resume();
    game.paused=false;
    $('#pause').classList.add('hidden');
  }
}

function finishGame(){
  game.state='results';
  const judged=game.perfect+game.great+game.good+game.miss;
  const acc=judged? (game.perfect+0.7*game.great+0.4*game.good)/judged : 0;
  const grade=acc>=0.95?'S':acc>=0.9?'A':acc>=0.8?'B':acc>=0.7?'C':'D';
  const t=TRACKS[game.trackIdx];
  const prev=loadBest(t.id,game.diff);
  const isNew=!prev || game.score>prev.score;
  if(game.score>0 || judged>0){
    saveBest(t.id,game.diff,{score:game.score,acc,combo:game.maxCombo,date:Date.now()});
  }
  $('#hud').classList.add('hidden');
  $('#pause').classList.add('hidden');
  $('#results').classList.remove('hidden');
  $('#resTrack').textContent=t.name+' · '+DIFF_LABEL[game.diff];
  $('#grade').textContent=grade;
  $('#grade').style.background='linear-gradient(120deg,'+(grade==='S'?'#ffd166,#ff2d95':grade==='A'?'#7cf7ff,#00e5ff':grade==='B'?'#b7ffd8,#06d6a0':grade==='C'?'#a9b8ff,#7c4dff':'#ff9a9a,#ff5d7a')+')';
  $('#newRecord').classList.toggle('hidden',!isNew);
  $('#resScore').textContent=fmtScore(game.score);
  $('#resAcc').textContent=Math.round(acc*100)+'%';
  $('#resCombo').textContent=game.maxCombo;
  $('#resJudge').textContent=game.perfect+' / '+game.great+' / '+game.good+' / '+game.miss;
  $('#menu').classList.add('hidden');
}

/* ================= 输入：任意键 ================= */
const IGNORE_KEYS={Control:1,Shift:1,Alt:1,Meta:1,CapsLock:1,Tab:1,F5:1,F12:1};

document.addEventListener('keydown',e=>{
  if(e.repeat) return;
  if(game.state==='menu'){
    if(e.code==='Enter'||e.code==='Space'){ e.preventDefault(); startGame(); }
    return;
  }
  if(game.state!=='playing') return;
  if(e.code==='KeyP'||e.code==='Escape'){ togglePause(); return; }
  if(IGNORE_KEYS[e.code]) return;
  if(e.code==='Space'||e.code.indexOf('Arrow')===0) e.preventDefault();
  if(!game.paused) press();
});

canvas.addEventListener('pointerdown',e=>{
  if(game.state==='playing'&&!game.paused) press();
});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden && game.state==='playing' && !game.paused) togglePause();
});

function press(){
  const gt=gameClock.now();
  const cur=game.notes[game.idx];
  if(cur===undefined) return;
  const d=Math.abs(gt-cur);
  if(d<=game.windows.good){
    const judge=d<=game.windows.perfect?'perfect':d<=game.windows.great?'great':'good';
    game[judge]++;
    game.combo++; game.maxCombo=Math.max(game.maxCombo,game.combo);
    const mult=1+Math.min(8,Math.floor(game.combo/20));
    game.score+={perfect:100,great:70,good:40}[judge]*mult;
    const pos=planetPos();
    game.idx++;
    spawnJudgment(JUDGE_TEXT[judge],JUDGE_COLORS[judge],pos.x,pos.y);
    spawnHitParticles(pos.x,pos.y,TRACKS[game.trackIdx].color);
    comboPop();
    playHitTick();
  }else if(gt<cur-game.windows.good){
    game.tooEarlyFlash=1;
  }
}

function buildPath(def){
  const W=innerWidth,H=innerHeight;
  const M=32;
  const pts=[];
  const cx=W/2, cy=H/2;
  if(def.path.type==='lemniscate'){
    const R=Math.min(W,H)*0.30;
    for(let i=0;i<M;i++){
      const th=i/M*Math.PI*2;
      const d=1+Math.sin(th)*Math.sin(th);
      pts.push({x:cx+R*Math.cos(th)/d, y:cy+R*Math.sin(th)*Math.cos(th)/d});
    }
  }else{
    const R=Math.min(W,H)*0.32;
    const a=def.path.a||0.35;
    const m=def.path.m||5;
    for(let i=0;i<M;i++){
      const th=i/M*Math.PI*2;
      const r=R*(1+a*Math.cos(m*th));
      pts.push({x:cx+r*Math.cos(th), y:cy+r*Math.sin(th)});
    }
  }
  return pts;
}

function planetPos(){
  const gt=gameClock.now();
  const P=game.path;
  if(!P.length || !game.notes.length) return {x:innerWidth/2,y:innerHeight/2};
  const n=P.length;
  const last=game.notes.length-1;
  const idx=Math.min(game.idx,last);
  const cur=game.notes[idx];
  const nextT=idx<last? game.notes[idx+1] : cur+1;
  const s=clamp((gt-cur)/(nextT-cur),0,1);
  const a=P[idx%n], b=P[(idx+1)%n];
  return {x:a.x+(b.x-a.x)*s, y:a.y+(b.y-a.y)*s};
}

function spawnJudgment(text,color,px,py){ game.judgments.push({t:0,text,color,px:px,py:py}); }

function spawnHitParticles(x,y,col){
  for(let i=0;i<28;i++){
    const ang=Math.random()*Math.PI*2;
    const sp=160+Math.random()*460;
    game.particles.push({
      x,y,
      vx:Math.cos(ang)*sp,
      vy:Math.sin(ang)*sp-40,
      g:560,
      life:0.35+Math.random()*0.4,
      maxLife:0.75,
      size:2+Math.random()*4.5,
      color:Math.random()<0.35?'#ffffff':col
    });
  }
  game.shockwaves.push({x:x,y:y,t:0,color:col});
  game.shake=Math.max(game.shake,5);
  game.flash={t:0,color:hexToRgba(col,0.18)};
  if(game.combo>0 && game.combo%20===0){
    game.multis.push({t:0,text:'COMBO '+game.combo+' !'});
    game.shake=Math.max(game.shake,8);
    game.shockwaves.push({x:x,y:y,t:0,color:'#ffffff'});
  }
}

function spawnMissBurst(x,y){
  for(let i=0;i<12;i++){

/* ================= 调度与更新 ================= */
function tickScheduler(){
  if(!game.events.length) return;
  const relNow=audio.ctx? audio.ctx.currentTime-gameClock.start : 0;
  const ahead=audio.ctx? 0.15 : 0;
  while(game.schedIdx<game.events.length && game.events[game.schedIdx].t<relNow+ahead){
    playEvent(game.events[game.schedIdx], gameClock.start+game.events[game.schedIdx].t);
    game.schedIdx++;
  }
}

function updateEffects(dt){
  const gt=gameClock.now();
  for(let i=game.particles.length-1;i>=0;i--){
    const p=game.particles[i];
    p.life-=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt;
    if(p.life<=0) game.particles.splice(i,1);
  }
  for(let i=game.judgments.length-1;i>=0;i--){
    game.judgments[i].t+=dt;
    if(game.judgments[i].t>0.7) game.judgments.splice(i,1);
  }
  for(let i=game.multis.length-1;i>=0;i--){
    game.multis[i].t+=dt;
    if(game.multis[i].t>0.8) game.multis.splice(i,1);
  }
  for(let i=game.shockwaves.length-1;i>=0;i--){
    game.shockwaves[i].t+=dt;
    if(game.shockwaves[i].t>0.6) game.shockwaves.splice(i,1);
  }
  game.shake=Math.max(0,game.shake-game.shake*9*dt);
  game.flash.t+=dt;
  game.barFlash=Math.max(0,game.barFlash-dt*4);
  game.missFlash=Math.max(0,game.missFlash-dt*3);
  game.tooEarlyFlash=Math.max(0,game.tooEarlyFlash-dt*3);
}

let lastT=0;
function update(now){
  const dt=clamp((now-lastT)/1000,0,0.05);
  lastT=now;
  if(game.state==='playing' && !game.paused){
    const gt=gameClock.now();
    tickScheduler();
    while(game.idx<game.notes.length && game.notes[game.idx]<gt-game.windows.good){
      const missed=game.notes[game.idx];
      game.miss++; game.combo=0;
      const pos=planetPos();
      game.idx++;
      spawnJudgment(JUDGE_TEXT.miss,JUDGE_COLORS.miss,pos.x,pos.y);
      spawnMissBurst(pos.x,pos.y);
      comboPop();
    }
    const judged=game.perfect+game.great+game.good+game.miss;
    const acc=judged? (game.perfect+0.7*game.great+0.4*game.good)/judged : 1;
    $('#score').textContent=fmtScore(game.score);
    $('#acc').textContent=Math.round(acc*100)+'%';
    $('#combo').textContent=game.combo;
    $('#comboSub').textContent=game.combo>1? game.combo+' COMBO':'';
    $('#progress').style.width=clamp(gt/game.endTime*100,0,100)+'%';
    if(game.idx>=game.notes.length && gt>game.endTime){ finishGame(); }
  }
  updateEffects(dt);
}

/* ================= 绘制 ================= */
const stars=Array.from({length:110},()=>({
  x:Math.random(),y:Math.random(),
  r:Math.random()*1.6+0.4,
  a:Math.random()*0.5+0.15,
  vx:Math.random()*0.008+0.003,
  tw:Math.random()*2+1,
  phase:Math.random()*Math.PI*2
}));

function drawStars(ctx){
  const W=innerWidth,H=innerHeight;
  const t=performance.now()/1000;
  for(const s of stars){
    const tw=0.5+0.5*Math.sin(t*s.tw+s.phase);
    ctx.globalAlpha=0.25+0.5*tw*s.a;
    ctx.fillStyle='#cfe8ff';
    ctx.beginPath();
    ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

const orbs=Array.from({length:9},()=>({
  x:Math.random(),y:Math.random(),
  r:24+Math.random()*55,
  hue:Math.random()*360,
  dx:(Math.random()-0.5)*0.018,
  dy:(Math.random()-0.5)*0.014,
  phase:Math.random()*Math.PI*2
}));

function drawOrbs(ctx){
  const t=performance.now()/1000;
  const W=innerWidth,H=innerHeight;
  for(const o of orbs){
    const x=(((o.x+o.dx*t*0.2)%1)+1)%1*W;
    const y=(((o.y+o.dy*t*0.2)%1)+1)%1*H;
    const a=0.05+0.04*Math.sin(t*0.7+o.phase);
    const rg=ctx.createRadialGradient(x,y,0,x,y,o.r);
    rg.addColorStop(0,'hsla('+o.hue+',80%,72%,'+a+')');
    rg.addColorStop(1,'hsla('+o.hue+',80%,72%,0)');
    ctx.fillStyle=rg;
    ctx.fillRect(x-o.r,y-o.r,o.r*2,o.r*2);
  }
}

function drawPath(ctx){
  const P=game.path;
  const n=P.length;
  if(!n) return;
  const col=TRACKS[game.trackIdx].color;
  // 整条轨道（固定，永远不变）
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.10)';
  ctx.lineWidth=3;
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const a=P[i%n], b=P[(i+1)%n], c=P[(i+2)%n];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    if(i===0) ctx.moveTo(mx,my);
    else ctx.quadraticCurveTo(b.x,b.y,mx,my);
  }
  ctx.closePath();
  ctx.stroke();
  // 光点当前所在路段高亮
  if(game.notes.length){
    const a=P[game.idx%n], b=P[(game.idx+1)%n];
    ctx.strokeStyle=hexToRgba(col,0.7);
    ctx.lineWidth=5;
    ctx.shadowColor=col;
    ctx.shadowBlur=14;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
    ctx.shadowBlur=0;
  }
  ctx.restore();
}

function drawNotes(ctx){
  const now=gameClock.now();
  const P=game.path;
  const n=P.length;
  if(!n) return;
  const col=TRACKS[game.trackIdx].color;
  // 前方音符光环
  for(let k=1;k<=4;k++){
    const idx=game.idx+k;
    if(idx>=game.notes.length) break;
    const p=P[idx%n];
    const near=k===1;
    ctx.strokeStyle=near? hexToRgba(col,0.9) : hexToRgba(col,0.32);
    ctx.lineWidth=near?3:2;
    ctx.beginPath();
    ctx.arc(p.x,p.y,near?13:10,0,Math.PI*2);
    ctx.stroke();
  }
  // 当前音符：光点到达前脉冲，到顶瞬间最亮
  if(game.idx<game.notes.length){
    const cur=game.notes[game.idx];
    const nextT=(game.idx+1<game.notes.length)? game.notes[game.idx+1] : cur+1;
    const s=clamp((now-cur)/(nextT-cur),0,1);
    const p=P[game.idx%n];
    ctx.strokeStyle=hexToRgba(col,0.45+0.5*s);
    ctx.lineWidth=2.5;
    ctx.shadowColor=col;
    ctx.shadowBlur=10+16*s;
    ctx.beginPath();
    ctx.arc(p.x,p.y,15+5*s,0,Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur=0;
  }
}

function drawPlanet(ctx){
  const p=planetPos();
  const col=TRACKS[game.trackIdx].color;
  // 尾迹光晕
  const halo=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,52);
  halo.addColorStop(0,hexToRgba(col,0.38));
  halo.addColorStop(1,hexToRgba(col,0));
  ctx.fillStyle=halo;
  ctx.beginPath();
  ctx.arc(p.x,p.y,52,0,Math.PI*2);
  ctx.fill();
  // 光点本体
  ctx.shadowColor=col;
  ctx.shadowBlur=26;
  ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.arc(p.x,p.y,10,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=hexToRgba(col,0.9);
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(p.x,p.y,13,0,Math.PI*2);
  ctx.stroke();
  // 自转亮点
  const t=performance.now()/1000;
  const ang=t*3;
  ctx.fillStyle=hexToRgba(col,0.9);
  ctx.beginPath();
  ctx.arc(p.x+Math.cos(ang)*8,p.y+Math.sin(ang)*8,2.4,0,Math.PI*2);
  ctx.fill();
}

function drawEffects(ctx){
  for(const p of game.particles){
    const a=clamp(p.life/p.maxLife,0,1);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*a+0.5,0,Math.PI*2);
    ctx.fill();
  }
  for(const r of game.shockwaves){
    const k=r.t/0.6;
    if(k>=1) continue;
    ctx.globalAlpha=(1-k)*0.8;
    ctx.strokeStyle=r.color;
    ctx.lineWidth=3*(1-k)+1;
    ctx.beginPath();
    ctx.arc(r.x,r.y,8+k*95,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawTexts(ctx){
  const W=innerWidth,H=innerHeight;
  for(const j of game.judgments){
    const a=1-j.t/0.65;
    if(a<=0) continue;
    ctx.globalAlpha=a;
    const pop=1+Math.max(0,0.7-j.t/0.12)*0.7;
    ctx.font='900 '+(30*pop)+'px '+FONT;
    ctx.textAlign='center';
    ctx.fillStyle=j.color;
    ctx.shadowColor=j.color;
    ctx.shadowBlur=18;
    ctx.fillText(j.text,clamp(j.px,90,W-90),j.py-26-j.t*46);
    ctx.shadowBlur=0;
  }
  for(const m of game.multis){
    const a=1-m.t/0.8;
    if(a<=0) continue;
    ctx.globalAlpha=a;
    ctx.font='900 40px '+FONT;
    ctx.textAlign='center';
    ctx.fillStyle='#ffd166';
    ctx.shadowColor='#ffd166';
    ctx.shadowBlur=24;
    ctx.fillText(m.text,W/2,H*0.22-m.t*40);
    ctx.shadowBlur=0;
  }
  if(game.tooEarlyFlash>0 && game.notes.length){
    const pos=planetPos();
    ctx.globalAlpha=game.tooEarlyFlash;
    ctx.font='700 15px '+FONT;
    ctx.textAlign='center';
    ctx.fillStyle='rgba(234,242,255,.6)';
    ctx.fillText('太早了',clamp(pos.x,90,W-90),pos.y+28);
    ctx.globalAlpha=1;
  }
  ctx.globalAlpha=1;
}

function draw(){
  const W=innerWidth,H=innerHeight;
  const hue=game.trackIdx===1?300:game.trackIdx===2?45:220;
  const bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'hsl('+hue+',52%,7%)');
  bg.addColorStop(1,'hsl('+(hue+22)+',56%,13%)');
  g.fillStyle=bg;
  g.fillRect(0,0,W,H);
  drawStars(g);
  drawOrbs(g);
  if(game.state==='playing'){
    const gt=gameClock.now();
    // 节拍脉动
    const spb=60/TRACKS[game.trackIdx].bpm;
    const pulse=Math.max(0,1-((gt%spb)+spb)%spb/0.14);
    if(pulse>0){
      const rg=g.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.6);
      rg.addColorStop(0,'rgba(255,255,255,'+(pulse*0.055)+')');
      rg.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=rg;
      g.fillRect(0,0,W,H);
    }
    // 屏幕震动
    const shx=(Math.random()*2-1)*game.shake;
    const shy=(Math.random()*2-1)*game.shake;
    g.save();
    g.translate(shx,shy);
    drawPath(g);
    drawNotes(g);
    drawPlanet(g);
    drawEffects(g);
    drawTexts(g);
    if(gt<-0.05){
      g.globalAlpha=Math.min(1,(-gt)/0.4);
      g.font='900 46px '+FONT;
      g.textAlign='center';
      g.fillStyle='#ffffff';
      g.shadowColor='#00e5ff';
      g.shadowBlur=30;
      g.fillText('READY',W/2,H*0.34);
      g.shadowBlur=0;
      g.globalAlpha=1;
    }else if(gt<0.5){
      g.globalAlpha=Math.max(0,1-gt/0.5);
      g.font='900 46px '+FONT;
      g.textAlign='center';
      g.fillStyle='#ffd166';
      g.shadowColor='#ffd166';
      g.shadowBlur=30;
      g.fillText('GO!',W/2,H*0.34);
      g.shadowBlur=0;
      g.globalAlpha=1;
    }
    g.restore();
  }
  const vig=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,.42)');
  g.fillStyle=vig;
  g.fillRect(0,0,W,H);
  // 命中 / 漏掉全屏闪光
  if(game.flash.t<0.3){
    g.globalAlpha=Math.max(0,1-game.flash.t/0.3)*0.7;
    g.fillStyle=game.flash.color;
    g.fillRect(0,0,W,H);
    g.globalAlpha=1;
  }
}

/* ================= 启动 ================= */
layout();
window.addEventListener('resize',layout);

function loop(now){
  requestAnimationFrame(loop);
  update(now);
  draw();
}
requestAnimationFrame(loop);

if(window.__NOVA_TEST__){
  window.__NOVA_TEST__={TRACKS,DIFF_LABEL,buildPattern,buildEvents,buildNeonSong,buildPath,planetPos};
}

})();
</script>
